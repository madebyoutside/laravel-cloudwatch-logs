name: Tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring, curl, xml
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit
